name: Studio macOS build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing studio-v tag to build and attach to its release (blank: test only)'
        required: false
        type: string
  push:
    tags:
      - 'studio-v*'

permissions:
  contents: read

concurrency:
  group: studio-macos-signing-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  studio:
    name: Sign and notarize Studio (Apple Silicon)
    runs-on: macos-26
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Prepare Rust and check Xcode
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup override set 1.96.0
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun actool --version --output-format=human-readable-text

      - name: Check version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          bun apps/desktop/scripts/check-release.ts
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Check frontend
        working-directory: apps/desktop
        run: |
          bun run check
          bun run test:unit

      - name: Test desktop backend
        run: cargo test -p desktop --lib --locked

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          : "${APPLE_CERTIFICATE:?Missing APPLE_CERTIFICATE}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD}"
          : "${APPLE_SIGNING_IDENTITY:?Missing APPLE_SIGNING_IDENTITY}"
          [[ "$APPLE_SIGNING_IDENTITY" == 'Developer ID Application: '* ]]
          certificate_path="$RUNNER_TEMP/humaan-signing.p12"
          keychain_path="$RUNNER_TEMP/humaan-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          umask 077
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 7200 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -k "$keychain_path" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | \
            grep -F -- "$APPLE_SIGNING_IDENTITY"
          rm -f "$certificate_path"

      - name: Build, sign, notarize, and staple
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_PASSWORD:?Missing APPLE_PASSWORD}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          bun run tauri build --bundles app,dmg --ci -- --locked

      - name: Verify and archive the notarized app
        run: |
          app_path="$GITHUB_WORKSPACE/target/release/bundle/macos/Humaan.app"
          test -f "$app_path/Contents/Resources/Assets.car"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          version="$(bun -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')"
          mkdir -p dist
          ditto -c -k --keepParent "$app_path" "dist/Humaan_${version}_aarch64.app.zip"

      - name: Sign and notarize the DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="${dmgs[0]}"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool store-credentials studio-dmg-ci \
            --keychain "$RUNNER_TEMP/humaan-signing.keychain-db" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          submit_exit=0
          xcrun notarytool submit "$dmg" \
            --keychain "$RUNNER_TEMP/humaan-signing.keychain-db" \
            --keychain-profile studio-dmg-ci --wait --timeout 30m --output-format json \
            > "$RUNNER_TEMP/studio-dmg-notarization.json" || submit_exit=$?
          cat "$RUNNER_TEMP/studio-dmg-notarization.json"
          submission_id="$(jq -r '.id // empty' "$RUNNER_TEMP/studio-dmg-notarization.json")"
          if [[ -n "$submission_id" ]]; then
            xcrun notarytool log "$submission_id" \
              --keychain "$RUNNER_TEMP/humaan-signing.keychain-db" \
              --keychain-profile studio-dmg-ci "$RUNNER_TEMP/studio-dmg-notarization-log.json" || true
          fi
          test "$submit_exit" -eq 0
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/studio-dmg-notarization.json"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          hdiutil verify "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          cp "$dmg" dist/
          cd dist
          shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS

      - name: Verify release asset names and checksums
        run: bun apps/desktop/scripts/check-release-assets.ts dist macos

      - name: Upload DMG notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-dmg-notarization-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/studio-dmg-notarization.json
            ${{ runner.temp }}/studio-dmg-notarization-log.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload verified download
        uses: actions/upload-artifact@v4
        with:
          name: humaan-studio-macos-aarch64-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/humaan-signing.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/humaan-signing.p12"

  attach-release:
    name: Attach verified Studio downloads
    needs: studio
    if: needs.studio.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: humaan-studio-macos-aarch64-${{ github.run_id }}
          path: dist

      - name: Upload to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.studio.outputs.release_tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName
          cd dist
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.dmg ./*.zip SHA256SUMS --clobber
