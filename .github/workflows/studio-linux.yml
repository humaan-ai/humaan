name: Studio Linux build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing studio-v tag to build and attach to its release (blank: test only)'
        required: false
        type: string
  push:
    tags:
      - 'studio-v*'

permissions:
  contents: read

concurrency:
  group: studio-linux-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  studio:
    name: Build Studio (Linux x86-64)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl wget file \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Prepare Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup override set 1.96.0

      - name: Check Studio version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          bun -e '
            const config = await Bun.file("apps/desktop/src-tauri/tauri.conf.json").json();
            if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(config.version)) {
              throw new Error("Unsupported release version");
            }
            const tag = process.env.RELEASE_TAG;
            if (tag && tag !== `studio-v${config.version}`) {
              throw new Error("Tag must be studio-v followed by the Studio version in tauri.conf.json");
            }
          '
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Check frontend
        working-directory: apps/desktop
        run: |
          bun run check
          bun run test:unit

      - name: Test desktop backend
        run: cargo test -p desktop --lib --locked

      - name: Build Linux packages
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bun run tauri build --bundles deb,appimage --ci -- --locked

      - name: Verify and collect Linux packages
        run: |
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          appimages=(target/release/bundle/appimage/*.AppImage)
          test "${#debs[@]}" -eq 1
          test "${#appimages[@]}" -eq 1
          dpkg-deb --info "${debs[0]}"
          test "$(dpkg-deb --field "${debs[0]}" Architecture)" = amd64
          # Extract without FUSE or a graphical display on the CI runner.
          appimage="$(realpath "${appimages[0]}")"
          mkdir -p "$RUNNER_TEMP/appimage-verify" dist
          (cd "$RUNNER_TEMP/appimage-verify" && "$appimage" --appimage-extract)
          test -x "$RUNNER_TEMP/appimage-verify/squashfs-root/AppRun"
          cp "${debs[0]}" "${appimages[0]}" dist/
          cd dist
          sha256sum ./*.deb ./*.AppImage > humaan-studio-linux-x86_64-SHA256SUMS
          sha256sum --check humaan-studio-linux-x86_64-SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: humaan-studio-linux-x86_64-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  attach-release:
    name: Attach Studio Linux downloads
    needs: studio
    if: needs.studio.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: humaan-studio-linux-x86_64-${{ github.run_id }}
          path: dist

      - name: Upload to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.studio.outputs.release_tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName
          cd dist
          sha256sum --check humaan-studio-linux-x86_64-SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.deb ./*.AppImage humaan-studio-linux-x86_64-SHA256SUMS --clobber
