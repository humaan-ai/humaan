name: CLI Linux build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing cli-v tag to build and attach to its release (blank: test only)'
        required: false
        type: string
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

concurrency:
  group: cli-linux-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    name: Build CLI (Linux x86-64)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Prepare Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup override set 1.96.0

      - name: Check CLI version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          cargo metadata --no-deps --format-version 1 --locked > "$RUNNER_TEMP/metadata.json"
          version="$(jq -er '.packages[] | select(.name == "humaan-cli") | .version' "$RUNNER_TEMP/metadata.json")"
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "cli-v$version" ]]; then
            echo "Tag must be cli-v$version" >&2
            exit 1
          fi
          echo "CLI_VERSION=$version" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Test and build CLI
        run: |
          cargo test -p humaan-cli -p humaan-engine --locked
          cargo build -p humaan-cli --release --locked

      - name: Package and verify CLI
        run: |
          mkdir -p "$RUNNER_TEMP/cli-payload" "$RUNNER_TEMP/cli-verify" dist
          cp target/release/humaan LICENSE "$RUNNER_TEMP/cli-payload/"
          tar -czf "dist/humaan-cli_${CLI_VERSION}_linux_x86_64.tar.gz" \
            -C "$RUNNER_TEMP/cli-payload" humaan LICENSE
          tar -xzf "dist/humaan-cli_${CLI_VERSION}_linux_x86_64.tar.gz" -C "$RUNNER_TEMP/cli-verify"
          cmp target/release/humaan "$RUNNER_TEMP/cli-verify/humaan"
          "$RUNNER_TEMP/cli-verify/humaan" --version
          "$RUNNER_TEMP/cli-verify/humaan" --help
          cd dist
          sha256sum ./*.tar.gz > humaan-cli-linux-x86_64-SHA256SUMS
          sha256sum --check humaan-cli-linux-x86_64-SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: humaan-cli-linux-x86_64-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  attach-release:
    name: Attach CLI Linux download
    needs: cli
    if: needs.cli.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: humaan-cli-linux-x86_64-${{ github.run_id }}
          path: dist

      - name: Upload to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.cli.outputs.release_tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName
          cd dist
          sha256sum --check humaan-cli-linux-x86_64-SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.tar.gz humaan-cli-linux-x86_64-SHA256SUMS --clobber
