name: Studio checks

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'version.json'
      - 'package.json'
      - 'scripts/**'
      - 'apps/cli/Cargo.toml'
      - '.github/workflows/studio-*.yml'
      - '.github/releases/**'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'version.json'
      - 'package.json'
      - 'scripts/**'
      - 'apps/cli/Cargo.toml'
      - '.github/workflows/studio-*.yml'
      - '.github/releases/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run check:release
      - run: bun test ../../scripts/sync-versions.test.ts
      - run: bun run check
      - run: bun run test:unit
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-failures
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
