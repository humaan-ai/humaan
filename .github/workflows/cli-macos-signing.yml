name: CLI macOS signing

on:
  workflow_dispatch:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

concurrency:
  group: cli-macos-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    name: Sign and notarize CLI (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup override set 1.96.0
          test "$(uname -m)" = arm64
          xcrun --find notarytool

      - name: Check CLI version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo metadata --no-deps --format-version 1 --locked > "$RUNNER_TEMP/metadata.json"
          version="$(jq -er '.packages[] | select(.name == "humaan-cli") | .version' "$RUNNER_TEMP/metadata.json")"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "cli-v$version" ]]; then
            echo "Tag must be cli-v$version" >&2
            exit 1
          fi
          echo "CLI_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test and build CLI
        run: |
          cargo test -p humaan-cli -p humaan-engine --locked
          cargo build -p humaan-cli --release --locked

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          : "${APPLE_CERTIFICATE:?Missing APPLE_CERTIFICATE}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD}"
          : "${APPLE_SIGNING_IDENTITY:?Missing APPLE_SIGNING_IDENTITY}"
          [[ "$APPLE_SIGNING_IDENTITY" == 'Developer ID Application: '* ]]
          certificate_path="$RUNNER_TEMP/humaan-signing.p12"
          keychain_path="$RUNNER_TEMP/humaan-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          umask 077
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 7200 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -k "$keychain_path" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | \
            grep -F -- "$APPLE_SIGNING_IDENTITY"
          rm -f "$certificate_path"

      - name: Sign CLI and create submission archive
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          mkdir -p "$RUNNER_TEMP/cli-payload" dist
          cp target/release/humaan "$RUNNER_TEMP/cli-payload/humaan"
          cp LICENSE "$RUNNER_TEMP/cli-payload/LICENSE"
          codesign --force --timestamp --options runtime \
            --identifier ai.humaan.cli --sign "$APPLE_SIGNING_IDENTITY" \
            "$RUNNER_TEMP/cli-payload/humaan"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/cli-payload/humaan"
          "$RUNNER_TEMP/cli-payload/humaan" --version
          "$RUNNER_TEMP/cli-payload/humaan" --help
          ditto -c -k "$RUNNER_TEMP/cli-payload" "$RUNNER_TEMP/cli-submission.zip"

      - name: Notarize CLI
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_PASSWORD:?Missing APPLE_PASSWORD}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          xcrun notarytool store-credentials humaan-cli-ci \
            --keychain "$RUNNER_TEMP/humaan-signing.keychain-db" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          submit_exit=0
          xcrun notarytool submit "$RUNNER_TEMP/cli-submission.zip" \
            --keychain "$RUNNER_TEMP/humaan-signing.keychain-db" \
            --keychain-profile humaan-cli-ci --wait --timeout 30m --output-format json \
            > "$RUNNER_TEMP/cli-notarization.json" || submit_exit=$?
          cat "$RUNNER_TEMP/cli-notarization.json"
          submission_id="$(jq -r '.id // empty' "$RUNNER_TEMP/cli-notarization.json")"
          if [[ -n "$submission_id" ]]; then
            xcrun notarytool log "$submission_id" \
              --keychain "$RUNNER_TEMP/humaan-signing.keychain-db" \
              --keychain-profile humaan-cli-ci "$RUNNER_TEMP/cli-notarization-log.json" || true
          fi
          test "$submit_exit" -eq 0
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/cli-notarization.json"

      - name: Verify and package accepted executable
        run: |
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/cli-payload/humaan"
          # A bare executable cannot have a notarization ticket stapled to it.
          # Preserve the exact accepted executable in the installer's tar archive.
          COPYFILE_DISABLE=1 tar -czf "dist/humaan-cli_${CLI_VERSION}_macos_arm64.tar.gz" \
            -C "$RUNNER_TEMP/cli-payload" humaan LICENSE
          mkdir -p "$RUNNER_TEMP/cli-verify"
          tar -xzf "dist/humaan-cli_${CLI_VERSION}_macos_arm64.tar.gz" -C "$RUNNER_TEMP/cli-verify"
          cmp "$RUNNER_TEMP/cli-payload/humaan" "$RUNNER_TEMP/cli-verify/humaan"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/cli-verify/humaan"
          "$RUNNER_TEMP/cli-verify/humaan" --version
          cd dist
          shasum -a 256 ./*.tar.gz > SHA256SUMS

      - name: Upload accepted CLI download
        uses: actions/upload-artifact@v4
        with:
          name: humaan-cli-macos-arm64-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humaan-cli-notarization-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cli-notarization.json
            ${{ runner.temp }}/cli-notarization-log.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/humaan-signing.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/humaan-signing.p12"
