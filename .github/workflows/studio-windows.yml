name: Studio Windows build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing studio-v tag to build and attach to its release (blank: test only)'
        required: false
        type: string
  push:
    tags:
      - 'studio-v*'

permissions:
  contents: read

concurrency:
  group: studio-windows-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  studio:
    name: Build Studio (Windows x86-64)
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Prepare Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup override set 1.96.0

      - name: Check Studio version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          bun apps/desktop/scripts/check-release.ts
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Check frontend
        working-directory: apps/desktop
        run: |
          bun run check
          bun run test:unit

      - name: Test desktop backend
        run: cargo test -p desktop --lib --locked --target x86_64-pc-windows-msvc

      - name: Build Windows installer
        working-directory: apps/desktop
        run: bun run tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci -- --locked

      - name: Verify and collect Windows installer
        run: |
          shopt -s nullglob
          installers=(target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          test "${#installers[@]}" -eq 1
          test -s "${installers[0]}"
          test -s target/x86_64-pc-windows-msvc/release/Humaan.exe
          7z l "${installers[0]}"
          mkdir -p dist
          cp "${installers[0]}" dist/
          cd dist
          sha256sum ./*.exe > humaan-studio-windows-x86_64-SHA256SUMS
          sha256sum --check humaan-studio-windows-x86_64-SHA256SUMS

      - name: Verify release asset names and checksums
        run: bun apps/desktop/scripts/check-release-assets.ts dist windows

      - uses: actions/upload-artifact@v4
        with:
          name: humaan-studio-windows-x86_64-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  attach-release:
    name: Attach Studio Windows downloads
    needs: studio
    if: needs.studio.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: humaan-studio-windows-x86_64-${{ github.run_id }}
          path: dist

      - name: Upload to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.studio.outputs.release_tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName
          cd dist
          sha256sum --check humaan-studio-windows-x86_64-SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.exe humaan-studio-windows-x86_64-SHA256SUMS --clobber
