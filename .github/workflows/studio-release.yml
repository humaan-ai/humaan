name: Verify Studio release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing studio-v tag with all three platform builds attached'
        required: true
        type: string
      publish:
        description: 'Publish the verified draft (after native installation checks)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: studio-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify version and release metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bun apps/desktop/scripts/check-release.ts
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,body > release.json
          bun -e '
            const r = await Bun.file("release.json").json();
            const tag = process.env.RELEASE_TAG;
            if (r.tagName !== tag || r.isPrerelease !== tag.slice("studio-v".length).includes("-")) {
              throw new Error("Release tag or prerelease status does not match");
            }
            if (!r.body.trim()) throw new Error("Release notes are required");
          '
      - name: Download and verify all platform assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" --dir dist
          bun apps/desktop/scripts/check-release-assets.ts dist all
      - name: Publish verified draft
        if: inputs.publish
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bun -e 'if (!(await Bun.file("release.json").json()).isDraft) throw new Error("Release is already published");'
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
