name: CLI Windows build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing cli-v tag to build and attach to its release (blank: test only)'
        required: false
        type: string
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

concurrency:
  group: cli-windows-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    name: Build CLI (Windows x86-64)
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Prepare Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup override set 1.96.0

      - name: Check CLI version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          bun scripts/sync-versions.ts --check
          cargo metadata --no-deps --format-version 1 --locked > "$RUNNER_TEMP/metadata.json"
          version="$(jq -er '.packages[] | select(.name == "humaan-cli") | .version' "$RUNNER_TEMP/metadata.json")"
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "cli-v$version" ]]; then
            echo "Tag must be cli-v$version" >&2
            exit 1
          fi
          echo "CLI_VERSION=$version" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Test and build CLI
        run: |
          cargo test -p humaan-cli -p humaan-engine --locked --target x86_64-pc-windows-msvc
          cargo build -p humaan-cli --release --locked --target x86_64-pc-windows-msvc

      - name: Package and verify CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:RUNNER_TEMP 'cli-payload'
          $verify = Join-Path $env:RUNNER_TEMP 'cli-verify'
          New-Item -ItemType Directory -Path $payload, $verify, 'dist' -Force | Out-Null
          $binary = 'target/x86_64-pc-windows-msvc/release/humaan.exe'
          Copy-Item $binary, 'LICENSE' -Destination $payload
          $archive = "dist/humaan-cli_$($env:CLI_VERSION)_windows_x86_64.zip"
          Compress-Archive -Path "$payload/humaan.exe", "$payload/LICENSE" -DestinationPath $archive
          Expand-Archive -Path $archive -DestinationPath $verify
          $unpacked = Join-Path $verify 'humaan.exe'
          if ((Get-FileHash $binary).Hash -ne (Get-FileHash $unpacked).Hash) {
            throw 'Packaged CLI does not match the built executable'
          }
          & $unpacked --version
          if ($LASTEXITCODE -ne 0) { throw 'CLI version smoke test failed' }
          & $unpacked --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help smoke test failed' }

      - name: Checksum CLI archive
        run: |
          cd dist
          sha256sum ./*.zip > humaan-cli-windows-x86_64-SHA256SUMS
          sha256sum --check humaan-cli-windows-x86_64-SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: humaan-cli-windows-x86_64-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  attach-release:
    name: Attach CLI Windows download
    needs: cli
    if: needs.cli.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: humaan-cli-windows-x86_64-${{ github.run_id }}
          path: dist

      - name: Upload to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.cli.outputs.release_tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName
          cd dist
          sha256sum --check humaan-cli-windows-x86_64-SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.zip humaan-cli-windows-x86_64-SHA256SUMS --clobber
