[package]
license.workspace = true
name = "humaan-cli"
version = "0.1.0-alpha.1"
edition = "2024"
description = "A local, offline CLI for managing robot experiences."

[[bin]]
name = "humaan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
humaan-engine = { path = "../../crates/engine" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde_json = "1"
