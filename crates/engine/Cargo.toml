[package]
name = "humaan-engine"
version = "0.0.1-alpha.0"
edition = "2024"
description = "Local recording import, inspection, and export for Humaan"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
