[package]
license.workspace = true
name = "humaan-engine"
version = "0.0.1-alpha.0"
edition = "2024"
description = "Local recording import, inspection, and export for Humaan"

[dependencies]
hex = "0.4.3"
parquet = { version = "59.3.0", default-features = false, features = ["json", "snap", "zstd", "lz4", "flate2-rust_backend"] }
rerun = { version = "=0.37.2", default-features = false, features = ["sdk", "video"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[features]
rerun = ["dep:rerun"]

[[example]]
name = "replay_rrd"
required-features = ["rerun"]
